services:
  - type: web
    name: cooling-hub-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: cooling-hub-db
          property: connectionString

databases:
  - name: cooling-hub-db
    databaseName: cooling_hub
    user: cooling_user
    plan: free
